name: AI Update Docs

# Triggered by the Cloudflare Worker via repository_dispatch.
# Listens for event_type: "propose-change"

on:
  repository_dispatch:
    types: [propose-change]
  workflow_dispatch:
    inputs:
      description:
        description: "Manual change request (for testing without the Worker)"
        required: true
        type: string
      versions:
        description: "Comma-separated versions to update (e.g. massachusetts,maine)"
        required: false
        default: "massachusetts"
        type: string
      include_tutorials:
        description: "Also update the tutorial files for the selected versions"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  update-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install anthropic pyyaml

      - name: Resolve change request and versions
        id: req
        env:
          EVENT_NAME: ${{ github.event_name }}
          WD_DESCRIPTION: ${{ github.event.inputs.description }}
          WD_VERSIONS: ${{ github.event.inputs.versions }}
          WD_INCLUDE_TUTORIALS: ${{ github.event.inputs.include_tutorials }}
          RD_DESCRIPTION: ${{ github.event.client_payload.description }}
          RD_VERSIONS: ${{ toJson(github.event.client_payload.versions) }}
          RD_INCLUDE_TUTORIALS: ${{ toJson(github.event.client_payload.include_tutorials) }}
        run: |
          python3 <<'PYEOF'
          import os, json, re, time, pathlib

          VALID_VERSIONS = {"massachusetts", "maine"}
          event_name = os.environ.get("EVENT_NAME", "")

          if event_name == "workflow_dispatch":
              desc = os.environ.get("WD_DESCRIPTION", "")
              versions_raw = os.environ.get("WD_VERSIONS", "massachusetts")
              versions = [v.strip() for v in versions_raw.split(",") if v.strip() in VALID_VERSIONS]
              include_tutorials = os.environ.get("WD_INCLUDE_TUTORIALS", "false").lower() == "true"
          else:
              desc = os.environ.get("RD_DESCRIPTION", "")
              versions_raw = os.environ.get("RD_VERSIONS", "null")
              try:
                  parsed = json.loads(versions_raw)
                  versions = [v for v in parsed if isinstance(v, str) and v in VALID_VERSIONS]
              except Exception:
                  versions = []
              try:
                  include_tutorials = json.loads(os.environ.get("RD_INCLUDE_TUTORIALS", "false")) is True
              except Exception:
                  include_tutorials = False

          if not versions:
              versions = ["massachusetts"]

          pathlib.Path("/tmp/change_request.txt").write_text(desc)
          pathlib.Path("/tmp/versions.json").write_text(json.dumps(versions))
          pathlib.Path("/tmp/include_tutorials.json").write_text(json.dumps(include_tutorials))

          print(f"Include tutorials: {include_tutorials}")

          print(f"Change request length: {len(desc)} chars")
          print(f"Versions: {versions}")

          slug = re.sub(r"[^a-z0-9]+", "-", desc.lower())[:50].rstrip("-") or "update"
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"slug={slug}\n")
              f.write(f"branch=ai/update-{slug}-{int(time.time())}\n")
          PYEOF

      - name: Run Claude to update the specs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python3 <<'PYEOF'
          import os, sys, json, pathlib
          from anthropic import Anthropic

          client = Anthropic()
          versions = json.loads(pathlib.Path("/tmp/versions.json").read_text())
          include_tutorials = json.loads(pathlib.Path("/tmp/include_tutorials.json").read_text())
          change_request = pathlib.Path("/tmp/change_request.txt").read_text()

          TUTORIAL_FILES = {
              "massachusetts": "create-new-member-ma.md",
              "maine":         "create-new-member-me.md",
          }

          system_prompt = """You are an expert OpenAPI 3.x specification editor. You will be given:
          1. The current OpenAPI YAML spec
          2. A change request from a user
          3. Optionally, one or more tutorial Markdown files that document the API

          Your job is to apply the requested change to the spec, and if tutorials are
          provided, update them to stay consistent with the spec changes. Call the
          submit_spec_update tool with the results.

          Critical rules:
          - Preserve all existing endpoints, schemas, and content unless the change explicitly requires modification
          - Keep the same overall structure, indentation style, and conventions
          - If the request is ambiguous, make a reasonable choice and note it in the explanation
          - The updated_spec must be valid OpenAPI 3.x YAML
          - Only include a tutorial in updated_tutorials if it actually needed changes
          - Always call the submit_spec_update tool. Do not respond in plain text."""

          tools = [{
              "name": "submit_spec_update",
              "description": "Submit the updated OpenAPI spec, optionally updated tutorials, and a written explanation.",
              "input_schema": {
                  "type": "object",
                  "properties": {
                      "updated_spec": {
                          "type": "string",
                          "description": "The FULL updated OpenAPI YAML as a string, with the requested change applied."
                      },
                      "updated_tutorials": {
                          "type": "object",
                          "description": "Map of tutorial filename to full updated Markdown content. Only include files that needed changes.",
                          "additionalProperties": {"type": "string"}
                      },
                      "explanation": {
                          "type": "string",
                          "description": "A 2-3 sentence plain-English summary of what was changed and why."
                      }
                  },
                  "required": ["updated_spec", "explanation"]
              }
          }]

          explanations = []

          for version in versions:
              spec_path = pathlib.Path(f"specs/{version}.yaml")
              if not spec_path.exists():
                  print(f"ERROR: specs/{version}.yaml not found")
                  sys.exit(1)

              current_spec = spec_path.read_text()

              tutorial_section = ""
              if include_tutorials and version in TUTORIAL_FILES:
                  tutorial_path = pathlib.Path(TUTORIAL_FILES[version])
                  if tutorial_path.exists():
                      tutorial_content = tutorial_path.read_text()
                      tutorial_section = f"""

          Current tutorial ({TUTORIAL_FILES[version]}):
          ```markdown
          {tutorial_content}
          ```

          If the spec change affects anything shown in the tutorial (e.g. request/response examples,
          field names, paths), update the tutorial to match and include it in updated_tutorials."""

              user_msg = f"""Current OpenAPI spec (version: {version}):
          ```yaml
          {current_spec}
          ```
          {tutorial_section}
          Change request:
          {change_request}

          Apply the change and call the submit_spec_update tool with the result."""

              response = client.messages.create(
                  model="claude-sonnet-4-6",
                  max_tokens=16000,
                  system=system_prompt,
                  tools=tools,
                  tool_choice={"type": "tool", "name": "submit_spec_update"},
                  messages=[{"role": "user", "content": user_msg}]
              )

              result = None
              for block in response.content:
                  if getattr(block, "type", None) == "tool_use" and block.name == "submit_spec_update":
                      result = block.input
                      break

              if result is None:
                  print(f"ERROR: Claude did not call submit_spec_update for {version}.")
                  print(f"Stop reason: {response.stop_reason}")
                  sys.exit(1)

              spec_path.write_text(result["updated_spec"])
              print(f"specs/{version}.yaml updated.")

              # Write back any updated tutorials
              updated_tutorials = result.get("updated_tutorials") or {}
              for filename, content in updated_tutorials.items():
                  tutorial_path = pathlib.Path(filename)
                  if tutorial_path.exists():
                      tutorial_path.write_text(content)
                      print(f"{filename} updated.")
                  else:
                      print(f"WARNING: Claude returned tutorial {filename} but file not found, skipping.")

              explanations.append(f"**{version}:** {result['explanation']}")

          combined = "\n\n".join(explanations)
          pathlib.Path("/tmp/explanation.txt").write_text(combined)
          print("All specs updated. Explanations:")
          print(combined)
          PYEOF

      - name: Validate the updated specs
        run: |
          pip install openapi-spec-validator
          python3 <<'PYEOF'
          import json, pathlib, yaml
          try:
              from openapi_spec_validator import validate_spec
          except ImportError:
              print("openapi-spec-validator not available, skipping validation")
              exit(0)

          versions = json.loads(pathlib.Path("/tmp/versions.json").read_text())
          for version in versions:
              spec_path = f"specs/{version}.yaml"
              try:
                  spec = yaml.safe_load(open(spec_path))
                  validate_spec(spec)
                  print(f"specs/{version}.yaml is valid OpenAPI 3.x")
              except Exception as e:
                  print(f"Validation failed for {version}: {e} — continuing (demo).")
          PYEOF

      - name: Check if there are changes
        id: diff
        run: |
          python3 <<'PYEOF'
          import json, subprocess, pathlib, os

          versions = json.loads(pathlib.Path("/tmp/versions.json").read_text())
          include_tutorials = json.loads(pathlib.Path("/tmp/include_tutorials.json").read_text())

          TUTORIAL_FILES = {
              "massachusetts": "create-new-member-ma.md",
              "maine":         "create-new-member-me.md",
          }

          candidates = []
          for version in versions:
              candidates.append(f"specs/{version}.yaml")
              if include_tutorials and version in TUTORIAL_FILES:
                  candidates.append(TUTORIAL_FILES[version])

          changed = []
          for path in candidates:
              r = subprocess.run(["git", "diff", "--quiet", path], capture_output=True)
              if r.returncode != 0:
                  changed.append(path)

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"changed={'true' if changed else 'false'}\n")

          if changed:
              print("Changes detected in:", ", ".join(changed))
              for path in changed:
                  subprocess.run(["git", "diff", "--stat", path])
          else:
              print("No changes produced by Claude. Exiting.")
          PYEOF

      - name: Create branch and commit
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "Chalk It Up AI Bot"
          git config user.email "bot@chalk-it-up.local"
          git checkout -b "${{ steps.req.outputs.branch }}"
          python3 <<'PYEOF'
          import json, subprocess, pathlib

          versions = json.loads(pathlib.Path("/tmp/versions.json").read_text())
          include_tutorials = json.loads(pathlib.Path("/tmp/include_tutorials.json").read_text())

          TUTORIAL_FILES = {
              "massachusetts": "create-new-member-ma.md",
              "maine":         "create-new-member-me.md",
          }

          candidates = []
          for version in versions:
              candidates.append(f"specs/{version}.yaml")
              if include_tutorials and version in TUTORIAL_FILES:
                  candidates.append(TUTORIAL_FILES[version])

          for path in candidates:
              r = subprocess.run(["git", "diff", "--quiet", path], capture_output=True)
              if r.returncode != 0:
                  subprocess.run(["git", "add", path])
          PYEOF
          EXPLANATION=$(cat /tmp/explanation.txt)
          REQUEST=$(cat /tmp/change_request.txt)
          git commit -m "AI: ${EXPLANATION:0:72}" -m "Change request: $REQUEST" -m "$EXPLANATION"
          git push origin "${{ steps.req.outputs.branch }}"

      - name: Open pull request
        if: steps.diff.outputs.changed == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXPLANATION=$(cat /tmp/explanation.txt)
          REQUEST=$(cat /tmp/change_request.txt)
          VERSIONS_LIST=$(python3 -c "import json,pathlib; v=json.loads(pathlib.Path('/tmp/versions.json').read_text()); print(', '.join(v))")
          TUTORIALS_LINE=$(python3 -c "import json,pathlib; inc=json.loads(pathlib.Path('/tmp/include_tutorials.json').read_text()); print('Yes' if inc else 'No')")
          PR_BODY=$(cat <<EOF
          ## AI-drafted documentation update

          **Change request:**
          > $REQUEST

          **Versions updated:** $VERSIONS_LIST
          **Tutorials updated:** $TUTORIALS_LINE

          **What Claude changed:**
          $EXPLANATION

          ---
          This PR was opened automatically by the AI documentation workflow.
          EOF
          )
          PR_URL=$(gh pr create \
            --base main \
            --head "${{ steps.req.outputs.branch }}" \
            --title "AI: ${EXPLANATION:0:60}" \
            --body "$PR_BODY")
          echo "pr_url=$PR_URL" >> $GITHUB_OUTPUT
          echo "::notice::PR opened: $PR_URL — awaiting human review"
